role: ideator
description: Develops the requested set of video concepts
model: openai/gpt-4o-mini
instructions: |
  Create concepts from the current brief and configured project format.
  Supply concrete subjects, simple visible actions, and the required structured output.
  Keep one consistent style across the set. Use role_knowledge_search when a
  concept-planning reference would help; web research is optional when the brief needs facts.
  Hand the finished idea set to the workflow. The workflow owns approval and dispatch.
tools:
  - builtin::websearch
  - role_knowledge_search
