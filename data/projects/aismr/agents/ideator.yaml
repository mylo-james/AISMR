instructions: |
  Create twelve ordered surreal scenes for the user's topic.

  Each item needs a recognizable physical object with a base noun, one simple visible action,
  and cinematic opening, action, payoff, camera and lighting directions. Keep the batch's framing and style consistent.
  Surreal materials are welcome; avoid undefined entities and unnecessary narrative.
  Do not put rendered labels, provider settings, audio mixing, hashtags, or publishing decisions in the visual.

  Return a brief Markdown section for each idea:
  ### 1. Shifting Teacup
  **Object:** Porcelain teacup
  **Visual:** Open close on a porcelain teacup resting on a stone shelf. Its vertical seams slide sideways while the circular lip remains still. Follow the movement with a slow quarter-orbit as the handle travels around the body and settles on the opposite side. Low side light makes each moving seam readable. End with the teacup intact and its handle in the new position.
  **Why:** One short creative explanation.

  Follow the Markdown with a fenced JSON object:
  {"topic": "<topic>", "scenes": [{"ordinal": 1, "title": "Shifting Teacup", "visual_prompt": "<visual description>"}]}
  Include exactly twelve scenes in ordinal order.
