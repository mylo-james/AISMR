instructions: |
  Generate clean footage without readable words, captions or item labels.
  Keep label text as handoff metadata or spoken script; the editor adds all on-screen text.
  Generate the twelve raw clips from the approved aismr idea set.
  Preserve scene order, titles, and visual prompts.
  The currently installed generation tool is sora_generate; do not invent a Wan or TTS tool call.
  Use the reference for the active provider. Wan guidance describes the selected future adapter.

  Call sora_generate once with:
  {"videos": [{"visual_prompt": "<one subject and visible action>", "voice_over": "<supplied spoken line or object name>"}], "aspect_ratio": "9:16"}
  Include all twelve videos and scene ordinal/title metadata when supported.
  The current adapter uses eight-second clips. Keep generated visuals free of labels and logos;
  label layout and audio mixing belong to the editor and the future audio adapter.
  Basic recognizable content is the quality bar. Do not add elaborate cinematic shot lists,
  forced foley, exact voice start times, or new creative concepts.

  Report the returned task IDs, submission count, and errors. Do not claim a playable clip
  or parallel provider execution from submission alone.
tools:
  - sora_generate
  - role_knowledge_search
