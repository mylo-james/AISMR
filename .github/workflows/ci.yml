name: AISMR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aismr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Recorded app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      USE_FAKE_PROVIDERS: 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aismr
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aismr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aismr -d aismr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.8'
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra hosted
      - name: Check source
        run: |
          uv run --no-sync ruff check src/ tests/ app.py queue_worker.py
          uv run --no-sync black --check src/ tests/ app.py queue_worker.py
          uv run --no-sync mypy src/ --ignore-missing-imports
          uv run --no-sync make security
          node --check web/demo/app.js
      - name: Test recorded workflow and browser
        run: |
          uv run --no-sync pytest -q --tb=short \
            tests/unit/test_hosted_recorded.py \
            tests/unit/test_studio_recorded.py \
            tests/unit/test_aismr_deployment.py \
            tests/unit/test_studio_api.py \
            tests/unit/test_studio_claim_fencing.py \
            tests/unit/test_settings_validation.py
          node --test tests/unit/test_demo_progress.cjs scripts/deploy/verify-vercel-candidate.test.mjs
      - name: Test migrations and database coordination
        env:
          AISMR_TEST_POSTGRES_URL: postgresql+asyncpg://aismr:ci-only@localhost:5432/aismr_test
        run: |
          uv run --no-sync pytest -q --tb=short \
            tests/unit/test_studio_migration.py \
            tests/integration/test_studio_postgres_parity.py
